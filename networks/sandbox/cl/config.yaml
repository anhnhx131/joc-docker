# Electra
# 2
BLOB_SIDECAR_SUBNET_COUNT_ELECTRA: 2
# uint64(2)
MAX_BLOBS_PER_BLOCK_ELECTRA: 2
# MAX_REQUEST_BLOCKS_DENEB * MAX_BLOBS_PER_BLOCK_ELECTRA
MAX_REQUEST_BLOB_SIDECARS_ELECTRA: 256

# Fulu
# 2**7 (= 128) groups
