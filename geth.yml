# geth.yml — Execution Client (Geth). Only loaded when ROLE=el-cl or all.
#
# NOT from the official guide — Option 3 ("self-hosted Execution +
# Consensus Client") is explicitly undocumented there ("Organizations
# selecting Option 3 should contact us directly"). This is this project's
# best-effort convention based on standard Geth usage, NOT copied from any
# JOC/JBF source. Treat every flag here as unverified until confirmed
# against what JBF/admin actually requires — see networks/README.md and
# the README's "Option 3 caveat" section.
#
# Split into its own file (eth-docker convention: one compose file per
# client) rather than living in the same file as "validator" — this means
# EL_CLIENT_IMAGE/EL_NETWORK_ID only ever get interpolated when this file
# is actually part of COMPOSE_FILE (ROLE=el-cl/all), so the compose-native
# required-variable syntax (":?") below is safe: it can no longer break
# `docker compose up` for ROLE=validator, which never loads this file.
services:
  execution:
    image: ${EL_CLIENT_IMAGE:?Set EL_CLIENT_IMAGE in .env before using ROLE=el-cl or ROLE=all. There is no default — this repo does not know which Geth version JOC requires. See networks/README.md.}
    container_name: execution
    restart: unless-stopped
    volumes:
      - ./data/execution:/data
      - ./networks/${NETWORK}/el:/network:ro
      - ./data/jwt.hex:/jwt.hex:ro
    command:
      - --datadir=/data
      - --networkid=${EL_NETWORK_ID:?Set EL_NETWORK_ID in .env before using ROLE=el-cl or ROLE=all. See networks/README.md.}
      - --bootnodes=${EL_BOOTNODES:-}
      - --syncmode=snap
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,engine
      - --authrpc.addr=0.0.0.0
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/jwt.hex
