# docker-compose.yml
#
# Which services run is controlled by ROLE in .env, translated by jocv into
# COMPOSE_PROFILES (jocv: profiles_for_role()) — docker compose reads
# COMPOSE_PROFILES natively (from .env, since it sits next to this file),
# no extra --profile flags needed:
#   ROLE=validator -> profile "validator"             (guide Option 2 — Recommended)
#   ROLE=el-cl     -> profile "el-cl"                 (plain node, no validator)
#   ROLE=all       -> profiles "el-cl" and "validator" (guide Option 3)
#
# IMPORTANT — provenance differs sharply between these services:
#   "validator"  — flags are guide-verbatim (Step 2-7). See README.md.
#   "execution"/"beacon" — the official guide does NOT document Option 3
#     ("Organizations selecting Option 3 should contact us directly.").
#     These two services are this project's best-effort convention based
#     on standard Geth/Lighthouse usage, NOT copied from any JOC/JBF
#     source. Treat every flag here as unverified until confirmed against
#     what JBF/admin actually requires — see networks/README.md and the
#     README's "Option 3 caveat" section.
services:
  execution:
    # EL_CLIENT_IMAGE/EL_NETWORK_ID have no default on purpose (this repo
    # does not know which Geth version/network ID JOC requires). Empty
    # fallbacks here (rather than compose's required-variable ':?' syntax)
    # are deliberate: compose interpolates every service's variables at
    # parse time regardless of which profile is active, so a required-var
    # error here would break `docker compose up` even for ROLE=validator,
    # which never touches this service. jocv's own preflight
    # (check_el_config()) is what actually enforces these
    # are set before starting this service — see networks/README.md.
    image: ${EL_CLIENT_IMAGE:-}
    container_name: execution
    restart: unless-stopped
    profiles: ["el-cl"]
    volumes:
      - ./data/execution:/data
      - ./networks/${NETWORK}/el:/network:ro
      - ./data/jwt.hex:/jwt.hex:ro
    command:
      - --datadir=/data
      - --networkid=${EL_NETWORK_ID:-}
      - --bootnodes=${EL_BOOTNODES:-}
      - --syncmode=snap
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,engine
      - --authrpc.addr=0.0.0.0
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/jwt.hex

  beacon:
    image: sigp/lighthouse:v7.0.1
    container_name: beacon
    restart: unless-stopped
    profiles: ["el-cl"]
    depends_on:
      - execution
    volumes:
      - ./data/beacon:/data
      - ./networks/${NETWORK}/cl:/network:ro
      - ./data/jwt.hex:/jwt.hex:ro
    command:
      - lighthouse
      - beacon_node
      - --datadir=/data
      - --testnet-dir=/network
      - --http
      - --http-address=0.0.0.0
      - --execution-endpoint=http://execution:8551
      - --execution-jwt=/jwt.hex
      - --boot-nodes=${CL_BOOTNODES:-}

  validator:
    image: sigp/lighthouse:v7.0.1
    container_name: validator
    restart: unless-stopped
    profiles: ["validator"]
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./networks/${NETWORK}/cl:/network:ro
    command:
      - lighthouse
      - validator_client
      - --validators-dir=/data/validators
      - --testnet-dir=/network
      - --suggested-fee-recipient=${WITHDRAWAL_ADDRESS}
      - --beacon-nodes=${BEACON_URL}
